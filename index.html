<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      color: #1e293b;
    }

    .container {
      display: flex;
      height: 100vh;
      gap: 1px;
      background: #e2e8f0;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .left-panel textarea {
      flex: 1;
      padding: 14px;
      border: none;
      font-size: 14px;
      line-height: 1.7;
      resize: none;
      outline: none;
      font-family: inherit;
      color: #334155;
    }

    .left-panel textarea::placeholder {
      color: #94a3b8;
    }

    .left-panel button {
      padding: 12px 20px;
      background: #64748b;
      color: #ffffff;
      border: none;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.15s;
    }

    .left-panel button:hover {
      background: #475569;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
    }

    .right-header {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #e2e8f0;
    }

    .sort-buttons {
      display: flex;
      align-items: stretch;
    }

    .sort-btn {
      padding: 10px 14px;
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sort-btn:hover {
      background: #f8fafc;
      color: #475569;
    }

    .sort-btn.active {
      background: #64748b;
      color: #ffffff;
    }

    .tags-container {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }

    .tag-item {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .tag-item:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
    }

    .tag-item.unsaved {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .tag-item.unsaved:hover {
      background: #dcfce7;
    }

    .tag-item.unsaved .tag-badge {
      background: #16a34a;
    }

    .tag-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      background: #94a3b8;
      color: #ffffff;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
    }

    .tag-text {
      color: #334155;
      font-size: 13px;
      white-space: nowrap;
      font-weight: 450;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: transparent;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s;
      margin-left: 4px;
    }

    .copy-btn:hover {
      background: #e2e8f0;
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      color: #94a3b8;
    }

    .copy-btn:hover svg {
      color: #64748b;
    }

    .copy-btn.copied svg {
      color: #16a34a;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    .tags-container:has(.empty-state) {
      align-content: center;
    }

    .empty-state svg {
      width: 32px;
      height: 32px;
      margin-bottom: 12px;
      opacity: 0.4;
      stroke-width: 1.5;
    }

    .empty-state p {
      line-height: 1.6;
    }

    .clear-btn {
      padding: 10px 14px;
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s;
    }

    .clear-btn:hover {
      background: #fef2f2;
    }

    .search-input {
      padding: 10px 14px;
      border: none;
      font-size: 12px;
      outline: none;
      flex: 1;
      min-width: 0;
      color: #334155;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .search-input:focus {
      background: #f8fafc;
    }

    .preview-section {
      padding: 10px 14px;
      background: #f0fdf4;
      border-bottom: 1px solid #bbf7d0;
    }

    .preview-section.hidden {
      display: none;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .preview-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #16a34a;
    }

    .preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      padding: 10px 16px;
      background: #64748b;
      color: #ffffff;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .tag-item.selected {
      background: #e0e7ff;
      border-color: #818cf8;
    }

    .tag-item.selected:hover {
      background: #c7d2fe;
    }

    .tag-item.editing {
      padding: 3px 6px;
    }

    .delete-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: transparent;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s;
      margin-left: 2px;
    }

    .delete-btn:hover {
      background: #fee2e2;
    }

    .delete-btn svg {
      width: 14px;
      height: 14px;
      color: #94a3b8;
    }

    .delete-btn:hover svg {
      color: #ef4444;
    }

    .edit-input {
      border: 1px solid #818cf8;
      border-radius: 2px;
      padding: 4px 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      min-width: 80px;
      background: #ffffff;
    }

    .edit-input:focus {
      box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.3);
    }

    .bulk-actions {
      display: none;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      padding: 0 10px;
    }

    .bulk-actions.visible {
      display: flex;
    }

    .selection-count {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .bulk-btn {
      padding: 6px 12px;
      background: #64748b;
      color: #ffffff;
      border: none;
      border-radius: 2px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bulk-btn:hover {
      background: #475569;
    }

    .bulk-btn.danger {
      background: #ef4444;
    }

    .bulk-btn.danger:hover {
      background: #dc2626;
    }

    .toast.undo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .undo-btn {
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: none;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .undo-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <textarea id="inputText" placeholder="Paste your text here...&#10;&#10;Split by commas (,) or periods (.)"></textarea>
      <button id="saveBtn">Save Tags</button>
    </div>

    <div class="right-panel">
      <div class="right-header">
        <div class="sort-buttons">
          <button class="sort-btn active" data-sort="popular">Popular</button>
          <button class="sort-btn" data-sort="newest">Newest</button>
          <button class="sort-btn" data-sort="longest">Longest</button>
          <button class="sort-btn" data-sort="shortest">Shortest</button>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="Search...">
        <div class="bulk-actions" id="bulkActions">
          <span class="selection-count" id="selectionCount">0 selected</span>
          <button class="bulk-btn" id="copyAllBtn">Copy All</button>
          <button class="bulk-btn danger" id="deleteSelectedBtn">Delete</button>
        </div>
        <button class="clear-btn" id="clearBtn">Clear</button>
      </div>
      <div class="preview-section hidden" id="previewSection">
        <div class="preview-header">
          <span class="preview-title">Preview (not saved yet)</span>
        </div>
        <div class="preview-tags" id="previewTags"></div>
      </div>
      <div class="tags-container" id="tagsContainer">
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
          <p>No tags yet.<br>Paste some text and click "Save Tags" to get started.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'saved_tags';
    let currentSort = 'popular';
    let searchQuery = '';
    let selectedTags = new Set();
    let lastDeletedTag = null;
    let undoTimeout = null;

    // Load tags from localStorage
    function loadTags() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : {};
    }

    // Save tags to localStorage
    function saveTags(tags) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tags));
    }

    // Parse input text into tags
    function parseText(text) {
      return text
        .toLowerCase()
        .split(/[,.]/)
        .map(tag => tag.trim())
        .filter(tag => tag.length > 0);
    }

    // Show toast notification
    function showToast(message, showUndo = false) {
      const toast = document.getElementById('toast');
      if (showUndo) {
        toast.innerHTML = `<span>${message}</span><button class="undo-btn" id="undoBtn">Undo</button>`;
        toast.classList.add('undo');
        const undoBtn = document.getElementById('undoBtn');
        undoBtn.addEventListener('click', handleUndo);
      } else {
        toast.textContent = message;
        toast.classList.remove('undo');
      }
      toast.classList.add('show');

      if (undoTimeout) clearTimeout(undoTimeout);
      undoTimeout = setTimeout(() => {
        toast.classList.remove('show');
        if (!showUndo) lastDeletedTag = null;
      }, showUndo ? 5000 : 2000);
    }

    // Handle undo action
    function handleUndo() {
      if (lastDeletedTag) {
        const tags = loadTags();
        tags[lastDeletedTag.text] = lastDeletedTag.data;
        saveTags(tags);
        lastDeletedTag = null;
        renderTags();
        showToast('Tag restored');
      }
    }

    // Copy text to clipboard
    async function copyToClipboard(text, button) {
      try {
        await navigator.clipboard.writeText(text);
        if (button) {
          button.classList.add('copied');
          setTimeout(() => button.classList.remove('copied'), 1500);
        }
        showToast('Copied to clipboard!');
      } catch (err) {
        showToast('Failed to copy');
      }
    }

    // Delete a single tag
    function deleteTag(tagText) {
      const tags = loadTags();
      if (tags[tagText]) {
        lastDeletedTag = { text: tagText, data: tags[tagText] };
        delete tags[tagText];
        saveTags(tags);
        selectedTags.delete(tagText);
        updateBulkActions();
        renderTags();
        showToast(`Deleted "${tagText}"`, true);
      }
    }

    // Start inline edit mode
    function startEdit(tagElement, tagText) {
      if (tagElement.classList.contains('editing')) return;

      tagElement.classList.add('editing');
      const tagContent = tagElement.querySelector('.tag-content');
      const tagTextSpan = tagElement.querySelector('.tag-text');
      const originalText = tagText;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = tagText;

      tagTextSpan.style.display = 'none';
      tagContent.appendChild(input);
      input.focus();
      input.select();

      const finishEdit = (save) => {
        const newText = input.value.trim().toLowerCase();
        tagElement.classList.remove('editing');
        input.remove();
        tagTextSpan.style.display = '';

        if (save && newText && newText !== originalText) {
          saveEdit(originalText, newText);
        }
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finishEdit(true);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          finishEdit(false);
        }
      });

      input.addEventListener('blur', () => finishEdit(true));
    }

    // Save edited tag
    function saveEdit(oldText, newText) {
      const tags = loadTags();
      if (tags[newText] && newText !== oldText) {
        // Merge counts if new tag already exists
        tags[newText].count += tags[oldText].count;
        tags[newText].timestamp = Date.now();
        delete tags[oldText];
        showToast(`Merged "${oldText}" into "${newText}"`);
      } else if (tags[oldText]) {
        const data = tags[oldText];
        delete tags[oldText];
        tags[newText] = data;
        showToast(`Renamed to "${newText}"`);
      }

      // Update selection
      if (selectedTags.has(oldText)) {
        selectedTags.delete(oldText);
        selectedTags.add(newText);
      }

      saveTags(tags);
      renderTags();
    }

    // Toggle tag selection
    function toggleSelection(tagText, tagElement) {
      if (selectedTags.has(tagText)) {
        selectedTags.delete(tagText);
        tagElement.classList.remove('selected');
      } else {
        selectedTags.add(tagText);
        tagElement.classList.add('selected');
      }
      updateBulkActions();
    }

    // Update bulk actions visibility
    function updateBulkActions() {
      const bulkActions = document.getElementById('bulkActions');
      const selectionCount = document.getElementById('selectionCount');

      if (selectedTags.size > 0) {
        bulkActions.classList.add('visible');
        selectionCount.textContent = `${selectedTags.size} selected`;
      } else {
        bulkActions.classList.remove('visible');
      }
    }

    // Clear all selections
    function clearSelection() {
      selectedTags.clear();
      document.querySelectorAll('.tag-item.selected').forEach(el => {
        el.classList.remove('selected');
      });
      updateBulkActions();
    }

    // Bulk copy selected tags
    async function bulkCopy() {
      const text = Array.from(selectedTags).join(', ');
      await copyToClipboard(text, null);
    }

    // Bulk delete selected tags
    function bulkDelete() {
      const count = selectedTags.size;
      if (count === 0) return;

      if (confirm(`Delete ${count} selected tag(s)?`)) {
        const tags = loadTags();
        selectedTags.forEach(tagText => {
          delete tags[tagText];
        });
        saveTags(tags);
        selectedTags.clear();
        updateBulkActions();
        renderTags();
        showToast(`Deleted ${count} tag(s)`);
      }
    }

    // Sort tags based on current sort mode
    function sortTags(tags) {
      const entries = Object.entries(tags);

      switch (currentSort) {
        case 'popular':
          return entries.sort((a, b) => b[1].count - a[1].count);
        case 'newest':
          return entries.sort((a, b) => b[1].timestamp - a[1].timestamp);
        case 'longest':
          return entries.sort((a, b) => b[0].length - a[0].length);
        case 'shortest':
          return entries.sort((a, b) => a[0].length - b[0].length);
        default:
          return entries;
      }
    }

    // Filter tags based on search query
    function filterTags(tags) {
      if (!searchQuery) return tags;
      return tags.filter(([text]) => text.includes(searchQuery.toLowerCase()));
    }

    // Render preview tags
    function renderPreview() {
      const input = document.getElementById('inputText');
      const previewSection = document.getElementById('previewSection');
      const previewContainer = document.getElementById('previewTags');
      const text = input.value.trim();

      if (!text) {
        previewSection.classList.add('hidden');
        return;
      }

      const newTags = parseText(text);
      if (newTags.length === 0) {
        previewSection.classList.add('hidden');
        return;
      }

      const savedTags = loadTags();

      // Build preview data: show what count will be after saving
      const previewData = {};
      newTags.forEach(tag => {
        if (previewData[tag]) {
          previewData[tag].count += 1;
        } else if (savedTags[tag]) {
          previewData[tag] = { count: savedTags[tag].count + 1, isExisting: true };
        } else {
          previewData[tag] = { count: 1, isExisting: false };
        }
      });

      previewSection.classList.remove('hidden');
      previewContainer.innerHTML = Object.entries(previewData).map(([text, data]) => `
        <div class="tag-item unsaved">
          <div class="tag-content">
            <span class="tag-badge">${data.isExisting ? '+' : ''}${data.count}</span>
            <span class="tag-text" title="${text}">${text}</span>
          </div>
          <button class="copy-btn" data-text="${text.replace(/"/g, '&quot;')}" title="Copy to clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </button>
        </div>
      `).join('');

      // Add click handlers for copy buttons
      previewContainer.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(btn.dataset.text, btn);
        });
      });
    }

    // Render tags to the container
    function renderTags() {
      const container = document.getElementById('tagsContainer');
      const tags = loadTags();
      const sortedTags = sortTags(tags);
      const filteredTags = filterTags(sortedTags);

      if (Object.keys(tags).length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
            <p>No tags yet.<br>Paste some text and click "Save Tags" to get started.</p>
          </div>
        `;
        return;
      }

      if (filteredTags.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <p>No tags match "${searchQuery}"</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredTags.map(([text, data]) => `
        <div class="tag-item${selectedTags.has(text) ? ' selected' : ''}" data-tag="${text.replace(/"/g, '&quot;')}">
          <div class="tag-content">
            <span class="tag-badge">${data.count}</span>
            <span class="tag-text" title="${text}">${text}</span>
          </div>
          <button class="copy-btn" data-text="${text.replace(/"/g, '&quot;')}" title="Copy to clipboard">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </button>
          <button class="delete-btn" data-text="${text.replace(/"/g, '&quot;')}" title="Delete tag">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      `).join('');

      // Add event handlers for tag items
      container.querySelectorAll('.tag-item').forEach(tagEl => {
        const tagText = tagEl.dataset.tag;

        // Single click to toggle selection
        tagEl.addEventListener('click', (e) => {
          if (e.target.closest('.copy-btn') || e.target.closest('.delete-btn') || e.target.closest('.edit-input')) {
            return;
          }
          toggleSelection(tagText, tagEl);
        });

        // Double click to edit
        tagEl.addEventListener('dblclick', (e) => {
          if (e.target.closest('.copy-btn') || e.target.closest('.delete-btn')) {
            return;
          }
          e.preventDefault();
          startEdit(tagEl, tagText);
        });
      });

      // Add click handlers for copy buttons
      container.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(btn.dataset.text, btn);
        });
      });

      // Add click handlers for delete buttons
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteTag(btn.dataset.text);
        });
      });

      updateBulkActions();
    }

    // Handle textarea input for live preview
    document.getElementById('inputText').addEventListener('input', renderPreview);

    // Handle save button click
    document.getElementById('saveBtn').addEventListener('click', () => {
      const input = document.getElementById('inputText');
      const text = input.value.trim();

      if (!text) {
        showToast('Please enter some text first');
        return;
      }

      const newTags = parseText(text);
      if (newTags.length === 0) {
        showToast('No valid tags found');
        return;
      }

      const tags = loadTags();
      const now = Date.now();

      newTags.forEach(tag => {
        if (tags[tag]) {
          tags[tag].count += 1;
          tags[tag].timestamp = now;
        } else {
          tags[tag] = { count: 1, timestamp: now };
        }
      });

      saveTags(tags);
      renderTags();
      input.value = '';
      document.getElementById('previewSection').classList.add('hidden');
      showToast(`Saved ${newTags.length} tag(s)`);
    });

    // Handle search input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTags();
    });

    // Handle sort button clicks
    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        renderTags();
      });
    });

    // Handle clear button click
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to clear all saved tags?')) {
        localStorage.removeItem(STORAGE_KEY);
        selectedTags.clear();
        updateBulkActions();
        renderTags();
        showToast('All tags cleared');
      }
    });

    // Handle bulk copy button
    document.getElementById('copyAllBtn').addEventListener('click', bulkCopy);

    // Handle bulk delete button
    document.getElementById('deleteSelectedBtn').addEventListener('click', bulkDelete);

    // Handle Escape key to deselect all
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && selectedTags.size > 0) {
        clearSelection();
      }
    });

    // Initial render
    renderTags();
  </script>
</body>
</html>
